name: Package module

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package for Companion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
      - name: Prepare Environment
        run: |
          npm install -g corepack
          corepack enable
      - name: Install
        run: yarn install
        env:
          CI: true
      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Package module
        run: yarn package
        env:
          CI: true
      - name: Upload Companion package
        uses: actions/upload-artifact@v6
        with:
          name: companion-module-dmxcore-dmxcore100
          path: dmxcore-dmxcore100-*.tgz
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dmxcore-dmxcore100-*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
